<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 60px; overflow: hidden;
    background: #1f64d8; color: #fff;
    font: 14px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: space-between;
  }
  #hint { padding: 0 18px; flex: 1; text-align: right; }
  #back {
    width: 170px; height: 60px; border: 0;
    background: #184fb0; color: #fff;
    font: 700 13.5px/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
    cursor: pointer;
  }
  #back:hover { background: #144399; }
</style>
</head>
<body>
  <div id="hint"></div>
  <button id="back" type="button">חזרה לאפליקציה</button>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('hint').textContent = q.get('hint') || '';
    document.getElementById('back').addEventListener('click', () => {
      if (window.sumitBar) window.sumitBar.back();
    });
  </script>
</body>
</html>
